<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" fill="none" stroke="#256b46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(300, 0) scale(-1, 1)">
    <!-- Trunk 1 -->
    <path d="M 50 600 C 70 450, 100 300, 150 150 C 160 135, 170 120, 180 110" stroke="#2e8055" stroke-width="5" />
    <!-- Trunk 2 -->
    <path d="M 10 600 C 30 480, 70 360, 110 240" stroke="#256b46" stroke-width="4" />

    <!-- Palm Leaves Group 1 -->
    <g opacity="0.85">
      <path d="M 180 110 Q 230 60 280 90 Q 220 110 180 110" fill="rgba(37, 107, 70, 0.2)" stroke="#349e69" />
      <path d="M 180 110 Q 240 110 270 160 Q 210 140 180 110" fill="rgba(37, 107, 70, 0.2)" stroke="#349e69" />
      <path d="M 180 110 Q 180 30 140 10 Q 160 70 180 110" fill="rgba(37, 107, 70, 0.2)" stroke="#349e69" />
      <path d="M 180 110 Q 120 50 70 80 Q 130 95 180 110" fill="rgba(37, 107, 70, 0.2)" stroke="#349e69" />
      <path d="M 180 110 Q 110 120 80 170 Q 140 140 180 110" fill="rgba(37, 107, 70, 0.2)" stroke="#349e69" />
      <path d="M 180 110 Q 150 180 170 230 Q 180 170 180 110" fill="rgba(37, 107, 70, 0.2)" stroke="#349e69" />
    </g>

    <!-- Palm Leaves Group 2 (Lower Trunk) -->
    <g opacity="0.75">
      <path d="M 110 240 Q 160 190 210 210 Q 150 230 110 240" fill="rgba(37, 107, 70, 0.15)" stroke="#2e8055" />
      <path d="M 110 240 Q 160 250 190 300 Q 140 280 110 240" fill="rgba(37, 107, 70, 0.15)" stroke="#2e8055" />
      <path d="M 110 240 Q 100 170 60 150 Q 80 200 110 240" fill="rgba(37, 107, 70, 0.15)" stroke="#2e8055" />
      <path d="M 110 240 Q 50 200 10 230 Q 60 245 110 240" fill="rgba(37, 107, 70, 0.15)" stroke="#2e8055" />
    </g>

    <!-- Coconuts & accents -->
    <circle cx="175" cy="115" r="7" fill="#1c5437" stroke="#349e69" />
    <circle cx="187" cy="118" r="6" fill="#1c5437" stroke="#349e69" />
    <circle cx="180" cy="125" r="7" fill="#1c5437" stroke="#349e69" />
  </g>
